spring:
  liquibase:
    enabled: true
    change-log: classpath:db/db.changelog-master.yaml
  jooq:
    sql-dialect: POSTGRES
  cloud:
    openfeign:
      client:
        config:
          file-storage-client:
            url: http://localhost:${wiremock.server.port}
          core-client:
            url: http://localhost:${wiremock.server.port}

zonky:
  test:
    database:
      type: postgres
      provider: zonky
      postgres:
        initdb:
          properties:
            locale: C
            encoding: UTF8

saas:
  doc-template:
    file-storage:
      namespace: doc-template-service
      external:
        folder: /doc-template
    template:
      variable:
        placeholder-regex: '\$\{([A-Za-z0-9_.$]+)}'
